[theme]
base = "dark"
primaryColor = "#ef233c"
backgroundColor = "#0a0708"
secondaryBackgroundColor = "#140c0e"
textColor = "#f4eeee"
font = "sans serif"

[server]
headless = true
runOnSave = false
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
